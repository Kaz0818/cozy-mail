name: CozyMail
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  MailCore:
    path: Packages/MailCore
  MailStore:
    path: Packages/MailStore
  AccountKit:
    path: Packages/AccountKit
targets:
  CozyMail:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: MailCore
      - package: MailStore
      - package: MailStore
        product: MailStoreSwiftData
      - package: AccountKit
      - package: AccountKit
        product: AccountKitKeychain
    entitlements:
      path: App/CozyMail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_NAME: Cozy Mail
        PRODUCT_MODULE_NAME: CozyMail
        PRODUCT_BUNDLE_IDENTIFIER: $(COZYMAIL_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cozy Mail
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: 0.0.1
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
  CozyMailTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
    dependencies:
      - target: CozyMail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COZYMAIL_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Cozy Mail.app/Contents/MacOS/Cozy Mail
        BUNDLE_LOADER: $(TEST_HOST)
  # 画面の自動テスト。アプリを起動してクリックなどを試す (見本のメールで動かし、本物のアカウントには触れない)
  CozyMailUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: CozyMail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COZYMAIL_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        TEST_TARGET_NAME: CozyMail
schemes:
  CozyMail:
    build:
      targets:
        CozyMail: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CozyMailTests
        - CozyMailUITests
