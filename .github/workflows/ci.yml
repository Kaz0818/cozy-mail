name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Packages/ は Mac に依存しないことを確かめる (SPEC 12 章)
  packages-linux:
    name: Packages (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Test MailCore
        run: swift test --package-path Packages/MailCore
      - name: Test MailStore
        run: swift test --package-path Packages/MailStore
      - name: Test AccountKit
        run: swift test --package-path Packages/AccountKit

  macos:
    name: App (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test packages
        run: |
          for package in MailCore MailStore AccountKit; do
            swift test --package-path "Packages/$package"
          done
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build and test app
        run: xcodebuild test -scheme CozyMail -destination 'platform=macOS' | tee xcodebuild.log
        shell: bash -o pipefail {0}
